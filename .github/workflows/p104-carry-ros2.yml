name: P104 CarryBus ROS 2 executor integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  carry-ros2-executor:
    name: CarryBus real ROS 2 executor integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-rclpy ros-jazzy-std-msgs python3-numpy

      - name: Run CarryBus executor integration test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tests/test_carry_ros2_executor.py
