name: P104 CarryBus ROS 2 executor integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, experiment/prepare-base-stillness-ab]

permissions:
  contents: read

jobs:
  carry-ros2-executor:
    name: CarryBus real ROS 2 executor integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ROS 2 Jazzy apt repository
        run: |
          # Configure the official ROS apt source directly. The GitHub
          # Releases asset endpoint intermittently returns HTTP 504 on runners.
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates
          sudo install -d -m 0755 /usr/share/keyrings
          sudo curl --fail --location --connect-timeout 20 --max-time 120 \
            --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 240 \
            --retry-connrefused \
            https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo ${UBUNTU_CODENAME}) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get -o Acquire::Retries=5 update

      - name: Install ROS 2 Jazzy and runtime dependencies
        run: |
          # Hosted runners can transiently lose DNS while downloading Ubuntu/ROS
          # packages. Let APT retry individual fetches rather than failing the job
          # on the first temporary resolver error.
          sudo apt-get -o Acquire::Retries=5 install -y ros-jazzy-ros-base ros-jazzy-rclpy ros-jazzy-std-msgs python3-numpy

      - name: Run CarryBus executor integration test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tests/test_carry_ros2_executor.py
