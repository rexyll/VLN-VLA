name: P104 CarryBus ROS 2 executor integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  carry-ros2-executor:
    name: CarryBus real ROS 2 executor integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ROS 2 Jazzy apt repository
        run: |
          # Pin the repository bootstrap package instead of resolving "latest"
          # through the setup action at runtime. The latter can fail when the
          # GitHub releases API is rate-limited or temporarily inconsistent.
          curl --fail --location --retry 3 --retry-delay 2 \
            -o /tmp/ros2-apt-source.deb \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update

      - name: Install ROS 2 Jazzy and runtime dependencies
        run: |
          sudo apt-get install -y ros-jazzy-ros-base ros-jazzy-rclpy ros-jazzy-std-msgs python3-numpy

      - name: Run CarryBus executor integration test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tests/test_carry_ros2_executor.py
