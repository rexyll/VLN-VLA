name: P104 Python syntax

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/person-occlusion-and-table-safe-arm-recovery

permissions:
  contents: read

jobs:
  py-compile:
    name: Compile changed Python modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile P104 source and regression scripts
        run: |
          python -m py_compile \
            tests/test_p104.py \
            tests/test_orbit.py \
            tests/random_eval.py \
            vla_ws/src/vla_follow/vla_follow/arm_kin.py \
            vla_ws/src/vla_follow/vla_follow/drink_motion.py \
            vla_ws/src/vla_follow/vla_follow/drink_task.py \
            vla_ws/src/vla_follow/vla_follow/follower.py \
            vla_ws/src/vla_follow/vla_follow/person_vision.py \
            vla_ws/src/vla_follow/vla_follow/scene_layout.py

  pure-unit-tests:
    name: Run P104 pure math and kinematics tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless
      - name: Run P104 pure tests without ROS/Gazebo
        run: python tests/test_p104.py
