name: VLA exclusive Gazebo ROS2 test lease

on:
  push:
    branches:
      - main
    paths:
      - tests/lease/start.json
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Git ref containing the code to test"
        required: true
        default: "experiment/drinktask-bt-ik-recovery"
        type: string
      idle_timeout_minutes:
        description: "Release after this many minutes without a new lease request"
        required: true
        default: "120"
        type: string

concurrency:
  group: vla-exclusive-test-environment
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  lease:
    name: Exclusive warm Gazebo ROS2 test environment
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TEST_REF: ${{ inputs.test_ref || 'experiment/drinktask-bt-ik-recovery' }}
      IDLE_TIMEOUT_MINUTES: ${{ inputs.idle_timeout_minutes || '120' }}
      CONTROL_REF: main
      REQUEST_FILE: tests/lease/request.json
    steps:
      - name: Checkout requested test ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.test_ref }}
          fetch-depth: 0

      - name: Configure Gazebo Harmonic apt repository
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl lsb-release gnupg ca-certificates
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg |
            sudo gpg --dearmor -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" |
            sudo tee /etc/apt/sources.list.d/gazebo-stable.list >/dev/null

      - name: Configure ROS 2 Jazzy apt repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          sudo curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" |
            sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null

      - name: Install Gazebo ROS2 and test dependencies once
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config cppzmq-dev iptables iproute2 \
            libgz-cmake3-dev libgz-plugin2-dev libgz-sim8-dev \
            libgz-transport13-dev libgz-msgs10-dev libgz-common5-dev \
            libgz-common5-profiler-dev libgz-math7-dev gz-harmonic \
            ros-jazzy-ros-base ros-jazzy-ament-cmake-gtest ros-jazzy-ros-gz-bridge ros-jazzy-ros-gz-sim \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            python3-colcon-common-extensions python3-numpy python3-opencv \
            python3-gz-transport13 python3-gz-msgs10 python3-pytest \
            xvfb x11-utils libgl1-mesa-dri libglx-mesa0
          echo "=== warm environment ready ==="
          gz sim --version
          source /opt/ros/jazzy/setup.bash
          ros2 --help >/dev/null
          ros2 pkg list >/dev/null
          echo "ROS 2 Jazzy CLI and package index are usable"

      - name: Build Gazebo system plugins once
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            vla_ws/src/vla_follow/vla_follow/gazebo_ground_lock.py \
            vla_ws/src/vla_follow/vla_follow/drink_task.py \
            tests/diag/run_chassis_ground_lock_gz.py \
            tests/diag/run_full_robot_internal_detachable_probe.py \
            tests/test_gazebo_ground_lock.py
          bash -n tools/gz_plugin.sh
          cmake -S vla_ws/src/vla_follow/gz_plugins \
            -B vla_ws/src/vla_follow/gz_plugins/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build vla_ws/src/vla_follow/gz_plugins/build --parallel 2


      - name: Initialize lease monitor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lease-runtime
          date +%s > .lease-runtime/lease_started_epoch
          git fetch origin "$TEST_REF" "$CONTROL_REF"
          printf '%s\n' "Exclusive lease started: $(date -Is)" | tee .lease-runtime/lease.log

      - name: Hold warm environment and process test requests
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          last_request_id=""
          last_request_epoch=$(cat .lease-runtime/lease_started_epoch)

          while true; do
            git fetch --quiet origin "$TEST_REF" "$CONTROL_REF"
            git reset --hard --quiet "origin/$TEST_REF"

            request_json=$(git show "origin/$CONTROL_REF:$REQUEST_FILE" 2>/dev/null || true)
            if [[ -n "$request_json" ]]; then
              request_id=$(printf "%s" "$request_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["request_id"])')
              request_epoch=$(git log -1 --format='%ct' "origin/$CONTROL_REF" -- "$REQUEST_FILE" || echo "$last_request_epoch")

              if [[ "$request_id" != "$last_request_id" ]]; then
                echo "=== new test request $request_id at $(date -Is) ===" | tee -a .lease-runtime/lease.log
                printf "%s\n" "$request_json" | tee -a .lease-runtime/lease.log
                operation=$(printf "%s" "$request_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["operation"])')
                mkdir -p ".lease-runtime/results/$request_id"
                set +e
                case "$operation" in
                  chassis-ground-lock)
                    timeout 900s python3 tests/diag/run_chassis_ground_lock_gz.py
                    rc=$?
                    ;;
                  full-robot-detachable)
                    timeout 1200s python3 tests/diag/run_full_robot_internal_detachable_probe.py
                    rc=$?
                    ;;
                  drinktask-e2e)
                    timeout 2400s bash tests/run_drink_headless.sh
                    rc=$?
                    ;;
                  p104-offline)
                    timeout 900s python3 -m pytest -q tests/test_p104.py tests/test_gazebo_ground_lock.py
                    rc=$?
                    ;;
                  base-arm-dynamics)
                    timeout 1200s python3 tests/diag/collect_base_arm_dynamics.py
                    rc=$?
                    ;;
                  smoke)
                    timeout 300s bash -lc 'source /opt/ros/jazzy/setup.bash && python3 -m pytest -q tests/test_gazebo_ground_lock.py'
                    rc=$?
                    ;;
                  *)
                    echo "Unsupported lease operation: $operation"
                    rc=64
                    ;;
                esac
                set -e

                {
                  echo "request_id=$request_id"
                  echo "operation=$operation"
                  echo "exit_code=$rc"
                  echo "finished_at=$(date -Is)"
                  echo "tested_ref=$(git rev-parse HEAD)"
                } | tee ".lease-runtime/results/$request_id/result.txt"

                echo "=== request $request_id finished rc=$rc ===" | tee -a .lease-runtime/lease.log
                last_request_id="$request_id"
                last_request_epoch="$request_epoch"
              fi
            fi

            now=$(date +%s)
            idle_seconds=$((now - last_request_epoch))
            idle_limit=$((IDLE_TIMEOUT_MINUTES * 60))
            if (( idle_seconds >= idle_limit )); then
              echo "=== releasing environment: no new request for $IDLE_TIMEOUT_MINUTES minutes ===" | tee -a .lease-runtime/lease.log
              break
            fi

            echo "lease heartbeat: idle=$idle_seconds seconds limit=$idle_limit seconds request=$last_request_id" | tee -a .lease-runtime/lease.log
            # Poll the stable control ref without reinstalling the Gazebo/ROS2 stack.
          sleep 30
          done

      - name: Upload lease diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vla-exclusive-test-lease-${{ github.run_id }}
          path: |
            .lease-runtime/
            log/
            vla_ws/logs/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
