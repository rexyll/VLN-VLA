# nav2_params.yaml —— P65/P71: 搜索段导航参数 (差速底盘, 真值定位)
# 由 launch/nav2_follow.launch.py 消费。只覆盖该 launch 实际拉起的 6 个节点:
#   map_server / planner_server / controller_server / behavior_server /
#   bt_navigator / velocity_smoother  (+ lifecycle_manager)
# 官方 navigation_launch.py 里那套 smoother/route/waypoint/docking/
# collision_monitor 已被弃用, 因此这里也不给它们留段落(见 P71 记录)。
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/earl/workspace/VLA/vla_demo/maps/arena.yaml"
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.40          # 目标点可能贴障, 允许规划到最近可达点
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      state_tolerance: 0.20
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 1.2
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.55
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.2
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20        # P71: 原来没设, 默认 0.10 → 会贴着立柱挤
      transform_tolerance: 0.3
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.38
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: false
      resolution: 0.05
      robot_radius: 0.20        # P71: 同上
      transform_tolerance: 0.3
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.38
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # P71: 单位是毫秒。官方默认 20ms, 在本机(4 路深度相机 + gz + ogre 同时跑)
    #      太紧 → BT 等 controller_server 的 follow_path ack 常常差几毫秒,
    #      报 "Timed out while waiting for action server to acknowledge" 后
    #      直接 "Goal failed"。放宽到 200ms, 不影响正常控制周期。
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # P71: Jazzy 起 navigators 必须显式声明, 否则 bt_navigator configure 失败,
    #      /navigate_to_pose action 不会出现
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocity: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.55, 0.0, 1.8]
    min_velocity: [-0.30, 0.0, -1.8]
    max_accel: [0.9, 0.0, 3.0]
    max_decel: [-1.2, 0.0, -3.0]
    odom_topic: "/odom"
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    # 与 nav2_follow.launch.py 的 LIFECYCLE_NODES 保持一致(launch 里会再显式覆盖一次)
    node_names:
      - "map_server"
      - "controller_server"
      - "planner_server"
      - "behavior_server"
      - "bt_navigator"
      - "velocity_smoother"
